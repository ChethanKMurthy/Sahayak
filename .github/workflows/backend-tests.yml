name: Backend tests

# Runs on PRs and on demand only — NOT on push, so the scheduled drip-release
# pushes to master don't trigger CI noise.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Unit tests
        working-directory: backend
        run: pytest -q tests
      - name: Smoke test
        working-directory: backend
        run: python smoke_test.py
