name: Android APK

# Builds a debug APK you can download from the run's Artifacts and sideload —
# no local Flutter toolchain needed.
on:
  push:
    branches: [main]
    paths: ["mobile/**", "shared/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      api_base:
        description: "API base URL the APK should talk to"
        required: false
        default: "http://10.0.2.2:8000"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: "stable" }

      - name: Generate Android platform scaffold
        working-directory: mobile
        run: flutter create --platforms=android --org com.sahayak .

      - name: Sync shared data + add permissions
        run: |
          bash scripts/sync-shared.sh
          MANIFEST=mobile/android/app/src/main/AndroidManifest.xml
          # Inject the required permissions if not already present.
          grep -q "android.permission.CAMERA" $MANIFEST || \
            sed -i 's#<manifest \(.*\)>#<manifest \1>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>#' $MANIFEST

      - name: Build debug APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug \
            --dart-define=API_BASE=${{ github.event.inputs.api_base || 'http://10.0.2.2:8000' }}

      - uses: actions/upload-artifact@v4
        with:
          name: sahayak-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
