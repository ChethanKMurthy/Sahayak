name: sahayak
description: "Sahayak — your government counter, on your phone."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  provider: ^6.1.2
  # Camera + on-device OCR (ML Kit) — the privacy/latency story runs here.
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.13.0
  # On-device voice: ASR + TTS in the user's language.
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  # Output + utility
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/strings.json
