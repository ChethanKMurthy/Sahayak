# Tooling config for the Sahayak backend (ruff + black).
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''/(\.venv|generated|__pycache__)/'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
